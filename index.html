<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>데일리 이슈</title>
  <meta name="description" content="5분이면 읽는 시사 이슈 데일리 트래킹 리포트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app" class="sheet" aria-live="polite"></div>
  <noscript><p style="padding:40px;text-align:center">이 리포트는 JavaScript가 필요합니다.</p></noscript>
  <script>
    /* 웹에 올렸을 때 오래된 캐시를 보지 않도록 매번 주소 뒤에 시각을 붙여 불러옵니다(순서 유지). */
    (function () {
      var v = Date.now();
      ['data/manifest.js', 'assets/app.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src + '?v=' + v; s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
